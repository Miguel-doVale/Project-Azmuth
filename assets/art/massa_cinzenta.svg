<?xml version="1.0" encoding="UTF-8"?>
<!-- Project Azmuth — Massa Cinzenta (Galvan), retrato estilizado para o Omnitrix HUD.
     Composição circular (viewBox 200x200) para caber na face do relógio. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <defs>
    <radialGradient id="skin" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#c3cbd0"/>
      <stop offset="0.6" stop-color="#959fa6"/>
      <stop offset="1" stop-color="#5e676e"/>
    </radialGradient>
    <radialGradient id="eye" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b4ffcc"/>
      <stop offset="0.45" stop-color="#4dff8a"/>
      <stop offset="1" stop-color="#11a64b"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f34"/>
      <stop offset="1" stop-color="#121518"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="face"><circle cx="100" cy="100" r="98"/></clipPath>
  </defs>

  <g clip-path="url(#face)">
    <!-- ombros / uniforme -->
    <path d="M18 212 C24 178 52 160 84 156 L116 156 C148 160 176 178 182 212 Z" fill="url(#suit)"/>
    <path d="M92 158 L108 158 L104 212 L96 212 Z" fill="#4dff8a" opacity="0.9"/>
    <path d="M56 170 C64 180 70 196 72 212" stroke="#4dff8a" stroke-width="3" fill="none" opacity="0.55"/>
    <path d="M144 170 C136 180 130 196 128 212" stroke="#4dff8a" stroke-width="3" fill="none" opacity="0.55"/>
    <!-- Omnitrix no peito -->
    <circle cx="100" cy="186" r="11" fill="#e8edf0" stroke="#2a2f34" stroke-width="2"/>
    <circle cx="100" cy="186" r="8" fill="#0c0f11"/>
    <path d="M94.5 180.5 L105.5 180.5 L100 186 Z M94.5 191.5 L105.5 191.5 L100 186 Z" fill="#4dff8a"/>

    <!-- pescoço -->
    <path d="M86 140 L114 140 L112 160 L88 160 Z" fill="#7d878e"/>

    <!-- cabeça: crânio largo de Galvan, queixo estreito -->
    <path d="M100 22
             C146 20 178 46 178 82
             C178 112 158 136 128 146
             C118 150 110 152 100 152
             C90 152 82 150 72 146
             C42 136 22 112 22 82
             C22 46 54 20 100 22 Z"
          fill="url(#skin)" stroke="#4b5359" stroke-width="2"/>
    <!-- sulcos do crânio -->
    <path d="M62 40 C74 50 84 54 100 54 C116 54 126 50 138 40" stroke="#6f787f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M74 30 C82 38 90 41 100 41 C110 41 118 38 126 30" stroke="#6f787f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- maçãs do rosto -->
    <path d="M44 112 C54 124 66 130 78 132" stroke="#6f787f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M156 112 C146 124 134 130 122 132" stroke="#6f787f" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- olhos -->
    <g filter="url(#glow)">
      <ellipse cx="68" cy="88" rx="25" ry="20" transform="rotate(-14 68 88)" fill="url(#eye)" stroke="#0f5c2c" stroke-width="2"/>
      <ellipse cx="132" cy="88" rx="25" ry="20" transform="rotate(14 132 88)" fill="url(#eye)" stroke="#0f5c2c" stroke-width="2"/>
    </g>
    <ellipse cx="72" cy="90" rx="9" ry="12" fill="#06110a"/>
    <ellipse cx="128" cy="90" rx="9" ry="12" fill="#06110a"/>
    <circle cx="68" cy="84" r="3.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="124" cy="84" r="3.5" fill="#ffffff" opacity="0.9"/>

    <!-- boca: sorriso confiante -->
    <path d="M88 128 C94 133 106 133 114 126" stroke="#3a4146" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
