# Project Azmuth — kitty (instalado via symlink em ~/.config/kitty/kitty.conf).
# Cores: geradas pelo core.py a cada DNA e recarregadas ao vivo (SIGUSR1).

include ~/.local/state/azmuth/kitty-colors.conf

font_family      Adwaita Mono
font_size        13.0
modify_font      cell_height 112%

window_padding_width 14
background_opacity   0.86
background_blur      0
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.08

cursor_shape        beam
cursor_beam_thickness 2
cursor_blink_interval 0.6
cursor_trail        3
cursor_trail_decay  0.1 0.35

tab_bar_edge        top
tab_bar_style       slant
tab_bar_min_tabs    2
tab_title_template  " {index}: {title[:28]} "
active_tab_font_style bold

url_style           curly
shell_integration   enabled
scrollback_lines    10000
copy_on_select      clipboard
strip_trailing_spaces smart
