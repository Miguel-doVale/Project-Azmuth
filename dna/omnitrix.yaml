# Roster do Omnitrix — quais aliens existem no disco e em qual slot.
#
# Não é um DNA (não segue o DNA schema): é o "catálogo" que o Master Control
# (Super + Numpad) e o Omnitrix HUD usam. Um alien só fica desbloqueado quando
# existe dna/<id>.yaml; até lá aparece como DNA bloqueado no HUD.
#
# `color` é só a cor de exibição no HUD enquanto o DNA não existe — quando o
# YAML existir, vale a palette.primary dele.

neutral: neutral   # estado base (Super + Esc, centro do disco)

slots:
  - { key: 1, id: massa_cinzenta, name: "Massa Cinzenta", color: "#4dff8a" }
  - { key: 2, id: xlr8,           name: "XLR8",           color: "#3b82f6" }
  - { key: 3, id: quatro_bracos,  name: "Quatro Braços",  color: "#ef4444" }
  - { key: 4, id: diamante,       name: "Diamante",       color: "#2dd4bf" }
  - { key: 5, id: besta,          name: "Besta",          color: "#f97316" }
  - { key: 6, id: fantasmatico,   name: "Fantasmático",   color: "#e2e8f0" }
  - { key: 7, id: aquatico,       name: "Aquático",       color: "#22d3ee" }
  - { key: 8, id: insectoide,     name: "Insectoide",     color: "#a3e635" }
  - { key: 9, id: ultra_t,        name: "Ultra-T",        color: "#84cc16" }
  - { key: 0, id: chama,          name: "Chama",          color: "#f59e0b" }
