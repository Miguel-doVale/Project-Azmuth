<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeria ASCII vivo</title>
<style>
:root{--bg:#05070c;--card:#0e1626;--fg:#cdd6f4;--pri:#38bdf8}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;padding:22px}
h1{font:700 20px monospace;letter-spacing:3px;color:var(--pri);margin-bottom:6px}
p.sub{opacity:.7;margin-bottom:18px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px}
.card{background:var(--card);border:1px solid #38bdf833;border-radius:14px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--pri)}.card img{width:100%;border-radius:8px;display:block}
.card b{font-weight:600}.card i{font-style:normal;font-size:12px;opacity:.6}
#v{position:fixed;inset:0;background:#000;display:none;flex-direction:column}
#v.on{display:flex}body:has(#v.on){overflow:hidden}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#0b0f19;border-bottom:1px solid #38bdf833}
.bar .t{font:700 15px monospace;letter-spacing:1px;margin:0 8px;min-width:240px}
.btn,.chip{background:#131c2e;border:1px solid #38bdf844;color:var(--fg);border-radius:10px;padding:6px 11px;cursor:pointer;font:600 13px system-ui;user-select:none}
.chip.on{background:var(--pri);color:#0b0f19;border-color:var(--pri)}
.sep{width:1px;height:24px;background:#38bdf833;margin:0 4px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw.on{border-color:#fff}
.stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{background:#050607;display:block}
.hint{font-size:12px;opacity:.5;margin-left:auto}
#v:fullscreen .bar{display:none}
</style></head><body>
<h1>GALERIA ASCII VIVO</h1>
<p class="sub">Clique numa cena para ver ela animada. Lá dentro: ← → troca de cena, os botões ligam/desligam cada efeito (as escolhas ficam salvas), F = tela cheia, O = Omnitrix, Esc = voltar.</p>
<div class="g" id="g"></div>
<div id="v">
  <div class="bar" id="bar">
    <span class="btn" id="prev">←</span><span class="t" id="title"></span><span class="btn" id="next">→</span>
    <span class="sep"></span><span id="fx" style="display:contents"></span>
    <span class="sep"></span><span class="chip" id="mode">Cores da foto</span><span id="dna" style="display:contents"></span>
    <span class="chip" id="every" style="display:none"></span><span class="sep"></span><span class="chip on" id="omni">Omnitrix</span><span class="btn" id="full">Tela cheia</span><span class="btn" id="close">✕</span>
  </div>
  <div class="stage" id="stage"><canvas id="c"></canvas></div>
</div>
<script>
const LIST = __LIST__;
const RAMP = " .'`^,:;Il!i><~+_-?][}{1)(|tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
const B36 = "0123456789abcdefghijklmnopqrstuvwxyz";
const DNAS = ["#38bdf8", "#4ade80", "#fb923c", "#a78bfa", "#f87171", "#e2e8f0"];
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v) } catch (e) { return d } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} } };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

// ── grade de miniaturas
const grid = document.getElementById('g');
LIST.forEach((s, n) => {
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = `<img src="${s.id}/preview.png" loading="lazy"><b>${n + 1}. ${s.title}</b><i>${s.fx.join(' · ')}</i>`;
  d.onclick = () => open(n); grid.appendChild(d);
});

// ── visualizador
const V = document.getElementById('v'), cv = document.getElementById('c'), g = cv.getContext('2d');
let burst = 0, idx = 0, S = null, L, C, W, H, cw, ch, base, layers = [], parts = {}, fxOn = [], tick = 0, last = 0, t0 = performance.now();
let mono = false, key = '', dna = hex(store.get('dna', DNAS[0])), showOmni = store.get('omni', true);
const cache = {};
window.__scene = sc => { cache[sc.id] = sc; if (car) { if (!S && sc.id === car.ids[0]) use(sc, LIST[idx].id); } else if (LIST[idx].id === sc.id) use(sc); };
let car = null;
const EVERY = [4, 6, 9, 15, 30, 60];
function carEvery() { return store.get('every:' + LIST[idx].id, LIST[idx].every || 9); }
function paintEvery() { const b = document.getElementById('every'); b.style.display = car ? '' : 'none'; if (car) b.textContent = `Troca a cada ${carEvery()} s`; }
document.getElementById('every').onclick = () => { const v = carEvery(), n = EVERY[(EVERY.indexOf(v) + 1) % EVERY.length]; store.set('every:' + LIST[idx].id, n); paintEvery(); };
function need(id) { if (cache[id]) return; const el = document.createElement('script'); el.src = id + '/scene.js'; document.head.appendChild(el); }
function open(n) {
  idx = (n + LIST.length) % LIST.length; V.classList.add('on');
  document.getElementById('title').textContent = `${idx + 1}/${LIST.length} · ${LIST[idx].title}`;
  car = null; burst = 0;
  setTimeout(paintEvery);
  if (LIST[idx].carousel) { car = { ids: LIST[idx].carousel, i: 0, at: performance.now() }; S = null; car.ids.forEach(need); if (cache[car.ids[0]]) use(cache[car.ids[0]], LIST[idx].id); return; }
  const id = LIST[idx].id;
  if (cache[id]) return use(cache[id]);
  S = null; const el = document.createElement('script'); el.src = id + '/scene.js'; document.head.appendChild(el);
}
function close() { V.classList.remove('on'); S = null; if (document.fullscreenElement) document.exitFullscreen(); }
function use(sc, k) {
  S = sc; const n = S.cols * S.rows; L = new Float32Array(n); C = new Uint8Array(n * 3);
  for (let y = 0; y < S.rows; y++) { const ls = S.lum[y], cs = S.col[y];
    for (let x = 0; x < S.cols; x++) { const i = y * S.cols + x; L[i] = B36.indexOf(ls[x]) / 35;
      C[i * 3] = parseInt(cs.substr(x * 6, 2), 16); C[i * 3 + 1] = parseInt(cs.substr(x * 6 + 2, 2), 16); C[i * 3 + 2] = parseInt(cs.substr(x * 6 + 4, 2), 16); } }
  key = k || S.id; mono = store.get('mono:' + key, !!S.mono); paintCtl();
  const saved = store.get('fx:' + key, null);
  fxOn = S.effects.map((e, k) => saved && saved[k] !== undefined ? saved[k] : e.on);
  chips(); fit();
}
function chips() {
  const box = document.getElementById('fx'); box.innerHTML = '';
  S.effects.forEach((e, k) => { const b = document.createElement('span'); b.className = 'chip' + (fxOn[k] ? ' on' : ''); b.textContent = `${k + 1}. ${e.nome}`;
    b.onclick = () => toggleFx(k); box.appendChild(b); });
}
function toggleFx(k) { if (!S || k >= fxOn.length) return; fxOn[k] = !fxOn[k]; store.set('fx:' + key, fxOn); chips(); prepare(); }
function fit() {
  if (!S) return; const st = document.getElementById('stage').getBoundingClientRect(); const D = devicePixelRatio || 1;
  let w = st.width, h = w * 9 / 16; if (h > st.height) { h = st.height; w = h * 16 / 9; }
  cv.style.width = w + 'px'; cv.style.height = h + 'px'; W = cv.width = Math.round(w * D); H = cv.height = Math.round(h * D);
  cw = W / S.cols; ch = H / S.rows; prepare();
}
addEventListener('resize', fit);
document.addEventListener('fullscreenchange', () => setTimeout(fit, 50));

// cor de uma célula: foto (cheia, tons escuros sobem) ou branco
function cellColor(i, l) {
  if (mono) return `rgba(230,236,245,${.25 + l * .75})`;
  const r = C[i * 3], gg = C[i * 3 + 1], b = C[i * 3 + 2], k = Math.max(1.15, 110 / Math.max(r, gg, b, 1));
  return `rgb(${Math.min(255, r * k) | 0},${Math.min(255, gg * k) | 0},${Math.min(255, b * k) | 0})`;
}
const charFor = l => RAMP[Math.min(RAMP.length - 1, Math.floor(l * (RAMP.length - 1)))];
const effColor = e => mono || !e.color || e.color === 'foto' || e.color === 'dna' ? dna : hex(e.color);
function canvas() { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); x.font = `700 ${ch * .95}px monospace`; x.textBaseline = 'top'; return [c, x]; }
function boxCells(e) { if (e.box) return [e.box[0] * S.cols, e.box[1] * S.rows, (e.box[2] - e.box[0]) * S.cols, (e.box[3] - e.box[1]) * S.rows]; return S.box; }

// camadas de brilho (pulso por cor e aura de contorno): desenhadas uma vez, piscam por transparência
function hsv(i) { const r = C[i * 3] / 255, gg = C[i * 3 + 1] / 255, b = C[i * 3 + 2] / 255, mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), d = mx - mn;
  let h = 0; if (d) h = mx === r ? ((gg - b) / d) % 6 : mx === gg ? (b - r) / d + 2 : (r - gg) / d + 4; h = (h * 60 + 360) % 360; return [h, mx ? d / mx : 0, mx]; }
function glowLayer(e, pick) {
  const [P, px] = canvas(); const col = effColor(e); let count = 0;
  for (let y = 0; y < S.rows; y++) for (let x = 0; x < S.cols; x++) { const i = y * S.cols + x; if (!pick(i, x, y)) continue; count++;
    const own = e.color === 'foto' && !mono; const l = Math.max(L[i], .45);
    px.fillStyle = own ? cellColor(i, 1) : rgba(col, 1); px.fillText(charFor(l), x * cw, y * ch); }
  const G = document.createElement('canvas'); G.width = W >> 1; G.height = H >> 1; const gx = G.getContext('2d');   // brilho em meia resolução: 4× mais barato
  gx.filter = `blur(${Math.max(2, ch * .3)}px)`; gx.drawImage(P, 0, 0, G.width, G.height); gx.drawImage(P, 0, 0, G.width, G.height);
  return { P, G, count };
}
function prepare() {
  if (!S) return;
  const [B, bx] = canvas(); bx.fillStyle = '#050607'; bx.fillRect(0, 0, W, H);
  for (let y = 0; y < S.rows; y++) for (let x = 0; x < S.cols; x++) { const i = y * S.cols + x, l = L[i]; if (l < .04) continue;
    bx.fillStyle = cellColor(i, l); bx.fillText(charFor(l), x * cw, y * ch); }
  base = B; layers = []; parts = {};
  S.effects.forEach((e, k) => {
    if (!fxOn[k]) return;
    if (e.type === 'pulso') layers[k] = glowLayer(e, i => { if (L[i] < .1) return false; const [h, s, v] = hsv(i);
      if (e.white) return s < .25 && v > .78; let dh = Math.abs(h - e.hue); dh = Math.min(dh, 360 - dh); return s > (e.minS ?? .3) && v > (e.minV ?? .3) && dh < e.range; });
    if (e.type === 'aura') layers[k] = glowLayer(e, (i, x, y) => { if (L[i] < .3 || x < 1 || y < 1 || x >= S.cols - 1 || y >= S.rows - 1) return false;
      return L[i - 1] < .1 || L[i + 1] < .1 || L[i - S.cols] < .1 || L[i + S.cols] < .1; });
  });
}

// ── efeitos animados
const rnd = (a, b) => a + Math.random() * (b - a);
function put(c, x, y) { g.fillText(c, x * cw, y * ch); }
const FX = {
  vento(e, k, t) { const [bx, by, bw, bh] = boxCells(e); const amp = (e.amp || 1);
    for (let y = Math.floor(by); y < by + bh && y < S.rows; y++) { const off = Math.round(amp * Math.sin(t * 1.7 + y * .42) + amp * .5 * Math.sin(t * 3.1 + y * .9)) * cw;
      if (!off) continue; const sx = bx * cw, w = bw * cw; g.fillStyle = '#050607'; g.fillRect(sx, y * ch, w, ch); g.drawImage(base, sx, y * ch, w, ch, sx + off, y * ch, w, ch); } },
  scan(e, k, t) { const col = effColor(e), period = 6, p = (t % period) / period, yb = (p * 1.3 - .15) * H, hb = H * .07;
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = .55; g.drawImage(base, 0, yb, W, hb, 0, yb, W, hb); g.restore();
    g.fillStyle = rgba(col, .5); g.fillRect(0, yb + hb * .5, W, Math.max(1, ch * .15)); g.fillStyle = rgba(col, .06); g.fillRect(0, yb, W, hb); },
  glow(e, k, t) { const ly = layers[k]; if (!ly) return; const sp = e.type === 'aura' ? 1.4 : 2.2, a = .2 + .8 * (.5 + .5 * Math.sin(t * sp + k));
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a * .9; g.drawImage(ly.G, 0, 0, W, H); g.globalAlpha = a * .55; g.drawImage(ly.P, 0, 0); g.restore(); },
  faiscas(e, k, t) { const col = effColor(e), list = parts[k] || (parts[k] = []), [bx, by, bw, bh] = boxCells(e), dir = e.dir || 'up', sp = e.speed || 1, dens = e.dens || 1;
    const n = dir === 'twinkle' ? 4 : 3; for (let q = 0; q < n * dens; q++) if (Math.random() < .8) {
      if (dir === 'up') list.push({ x: rnd(bx, bx + bw), y: rnd(by + bh * .3, by + bh), vx: rnd(-.3, .3), vy: -rnd(.4, 1.3) * sp, life: rnd(8, 22) });
      else if (dir === 'out') { const a = rnd(0, 6.28), cx = bx + bw / 2, cy = by + bh / 2; list.push({ x: cx + Math.cos(a) * bw * .2, y: cy + Math.sin(a) * bh * .2, vx: Math.cos(a) * rnd(.8, 2.2) * sp / .58, vy: Math.sin(a) * rnd(.8, 2.2) * sp, life: rnd(8, 20) }); }
      else if (dir === 'diag') { if (Math.random() < .1) list.push({ x: rnd(-20, S.cols * .6), y: rnd(-10, S.rows * .3), vx: 3.2 * sp, vy: 1.2 * sp, life: 26, trail: 1 }); }
      else list.push({ x: rnd(bx, bx + bw), y: rnd(by, by + bh), vx: 0, vy: 0, life: rnd(3, 9), tw: 1 }); }
    for (let i = list.length - 1; i >= 0; i--) { const p = list[i]; p.x += p.vx; p.y += p.vy; p.vx += rnd(-.1, .1); if (--p.life <= 0 || p.y < -2) { list.splice(i, 1); continue; }
      const a = Math.min(1, p.life / 8); g.fillStyle = Math.random() < .15 ? rgba([255, 255, 255], a) : rgba(col, a);
      if (p.trail) { for (let j = 1; j < 7; j++) { g.fillStyle = rgba(col, a * (1 - j / 7) * .7); put(j < 3 ? '=' : '-', p.x - j * 1.2, p.y - j * .45); } g.fillStyle = rgba([255, 255, 255], a); put('*', p.x, p.y); }
      else put(p.tw ? '+*.'[p.life % 3 | 0] : '.,\'*+'[(p.life | 0) % 5], p.x, p.y); }
    if (list.length > 600) list.splice(0, list.length - 600); },
  bolhas(e, k, t) { const col = effColor(e), list = parts[k] || (parts[k] = []), [bx, by, bw, bh] = boxCells(e);
    g.save(); g.beginPath(); g.rect(bx * cw, by * ch, bw * cw, bh * ch); g.clip();
    if (Math.random() < .5) list.push({ x: rnd(bx, bx + bw), y: by + bh, s: Math.random(), ph: rnd(0, 6) });
    for (let i = list.length - 1; i >= 0; i--) { const p = list[i]; p.y -= .35 + p.s * .5; if (p.y < by) { list.splice(i, 1); continue; }
      g.fillStyle = rgba(col, .35 + p.s * .5); put(p.s > .7 ? 'O' : p.s > .35 ? 'o' : '°', p.x + Math.sin(t * 2 + p.ph) * 1.2, p.y); } g.restore(); },
  estrelas(e, k, t) { const col = effColor(e); let list = parts[k];
    if (!list) { list = parts[k] = []; let tries = 0; while (list.length < 160 && tries++ < 5000) { const x = rnd(0, S.cols) | 0, y = rnd(0, S.rows) | 0; if (L[y * S.cols + x] < .12) list.push({ x, y, ph: rnd(0, 6.28), sp: rnd(.6, 2) }); } }
    list.forEach(p => { const v = Math.sin(t * p.sp + p.ph); if (v < .2) return; g.fillStyle = rgba(v > .85 ? [255, 255, 255] : col, (v - .2) * 1.2); put(v > .9 ? '*' : v > .6 ? '+' : '.', p.x, p.y); }); },
  chuva(e, k, t) { const col = effColor(e); let list = parts[k]; if (!list) { list = parts[k] = []; for (let i = 0; i < 260; i++) list.push({ x: rnd(0, S.cols), y: rnd(0, S.rows), s: rnd(.6, 1) }); }
    list.forEach(p => { p.y += 2.6 * p.s; p.x += .6 * p.s; if (p.y > S.rows) { p.y = rnd(-6, 0); p.x = rnd(-10, S.cols); }
      g.fillStyle = rgba(col, .25 + p.s * .35); put('/', p.x, p.y); if (p.s > .85) put('/', p.x - .4, p.y - 1); }); },
  neve(e, k, t) { const col = effColor(e), wind = e.wind || .6; let list = parts[k]; if (!list) { list = parts[k] = []; for (let i = 0; i < 220; i++) list.push({ x: rnd(0, S.cols), y: rnd(0, S.rows), s: rnd(.3, 1), ph: rnd(0, 6) }); }
    list.forEach(p => { p.y += .35 + p.s * .55; p.x += wind * p.s * .9 + Math.sin(t + p.ph) * .3; if (p.y > S.rows || p.x > S.cols + 2) { p.y = rnd(-4, 0); p.x = rnd(-30, S.cols); }
      g.fillStyle = rgba(col, .3 + p.s * .6); put(p.s > .75 ? '*' : p.s > .45 ? '+' : '.', p.x, p.y); }); },
  orbita(e, k, t, front) { const col = effColor(e), n = e.n || 60; for (let i = 0; i < n; i++) { const a = t * .5 + i * 6.283 / n + Math.sin(i * 7.3) * .2;
      const z = Math.sin(a); if (front ? z < 0 : z >= 0) continue;
      const x = (e.cx * W + Math.cos(a) * e.rx * H) / cw, y = (e.cy * H + z * e.ry * H) / ch, f = front ? 1 : .45;
      g.fillStyle = rgba(i % 9 ? col : [255, 255, 255], f); put(front ? '*' : '.', x, y);
      for (let j = 1; j < 4; j++) { const b = a - j * .035; g.fillStyle = rgba(col, f * (1 - j / 4) * .6); put('-', (e.cx * W + Math.cos(b) * e.rx * H) / cw, (e.cy * H + Math.sin(b) * e.ry * H) / ch); } } },
  raios(e, k, t) { const col = effColor(e), list = parts[k] || (parts[k] = []), [bx, by, bw, bh] = boxCells(e), rate = e.rate ?? .85;
    const spawn = () => { const pts = []; let x = bx + bw * rnd(.1, .9), y = by + bh * rnd(.1, .9), dx = Math.random() < .5 ? -1 : 1, n = rnd(10, 28);
      for (let i = 0; i < n; i++) { pts.push([Math.round(x), Math.round(y)]); x += dx * rnd(1, 3); y += rnd(-1, 1.2);
        if (Math.random() < .12) { let gx = x, gy = y; for (let j = 0; j < 5; j++) { gx += dx * 1.5; gy += rnd(-.6, 1.4); pts.push([Math.round(gx), Math.round(gy)]); } } }
      list.push({ pts, life: rnd(2, 6) | 0 }); };
    if (Math.random() < rate) spawn(); if (Math.random() < rate * .45) spawn();
    for (let i = list.length - 1; i >= 0; i--) if (list[i].life-- <= 0) list.splice(i, 1);
    g.shadowColor = rgba(col, 1); g.shadowBlur = ch;
    list.forEach(b => b.pts.forEach(([x, y], i) => { const nx = b.pts[i + 1]; g.fillStyle = Math.random() < .25 ? '#fff' : rgba(col, 1); put(!nx ? '*' : nx[1] < y ? '/' : nx[1] > y ? '\\' : '-', x, y); }));
    g.shadowBlur = 0; },
  rastro(e, k, t) { const col = effColor(e), [bx, by, bw, bh] = boxCells(e), left = (e.dir || 'left') === 'left';
    for (let y = Math.floor(by); y < by + bh && y < S.rows; y++) { if ((y + tick) % 3) continue; let edge = -1;
      if (left) { for (let x = Math.floor(bx); x < bx + bw; x++) if (L[y * S.cols + x] > .35) { edge = x; break; } }
      else { for (let x = Math.floor(bx + bw) - 1; x >= bx; x--) if (L[y * S.cols + x] > .35) { edge = x; break; } }
      if (edge < 0) continue; const len = 6 + ((y * 7 + tick * 3) % 20), dir = left ? -1 : 1;
      for (let j = 1; j <= len; j++) { g.fillStyle = rgba(col, (1 - j / len) * .6); put(j % 4 ? '-' : '=', edge + dir * (j + (tick * 2) % 4), y); } } },
  glitch(e, k, t) { const col = effColor(e), list = parts[k] || (parts[k] = []);
    if (Math.random() < .1) list.push({ y: rnd(0, S.rows) | 0, h: 1 + (rnd(0, 4) | 0), dx: rnd(-.5, .5) * W * .03, life: 2 + (rnd(0, 2) | 0) });
    for (let i = list.length - 1; i >= 0; i--) { const q = list[i]; if (q.life-- <= 0) { list.splice(i, 1); continue; }
      const y = q.y * ch, h = q.h * ch; g.drawImage(cv, 0, y, W, h, q.dx, y, W, h); g.fillStyle = rgba(col, .1); g.fillRect(0, y, W, h);
      if (Math.random() < .5) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = .35; g.drawImage(cv, 0, y, W, h, -q.dx * .6, y, W, h); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; } } },
